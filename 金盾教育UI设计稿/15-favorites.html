<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的收藏 - 金盾教育分销小程序</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#E8E8ED;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.phone-frame{width:375px;height:812px;background:#0d0d0d;border-radius:44px;position:relative;box-shadow:0 0 0 3px #1a1a1a,0 0 0 6px #0d0d0d,0 0 0 8px #222,0 12px 50px rgba(0,0,0,0.35);overflow:hidden}
.phone-screen{position:absolute;top:0;left:0;right:0;bottom:0;background:#F5F5F5;border-radius:40px;overflow:hidden;display:flex;flex-direction:column}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:210px;height:30px;background:#0d0d0d;border-radius:0 0 20px 20px;z-index:100}
.home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:rgba(0,0,0,0.15);border-radius:3px;z-index:100}
.status-bar{height:54px;background:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:12px;font-weight:600;flex-shrink:0}
.status-time{font-weight:600;letter-spacing:0.5px}
.status-icons{display:flex;align-items:center;gap:6px}
.nav-bar{height:44px;background:#fff;display:flex;align-items:center;padding:0 12px;flex-shrink:0;border-bottom:0.5px solid #EEE}
.nav-back{font-size:20px;color:#333;cursor:pointer;padding:6px 8px;text-decoration:none}
.nav-back:active{opacity:0.5}
.nav-title{flex:1;text-align:center;font-size:15px;font-weight:600;color:#000;padding-right:40px}
.scroll-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll-content::-webkit-scrollbar{width:0}
.course-list{padding:10px 12px}
.course-item{background:#fff;border-radius:10px;margin-bottom:10px;display:flex;overflow:hidden;cursor:pointer;border:0.5px solid #F0F0F0;transition:transform .15s}
.course-item:active{transform:scale(0.98)}
.course-cover{width:120px;height:80px;display:flex;align-items:center;justify-content:center;flex-shrink:0;flex-direction:column}
.course-cover-icon{font-size:28px;opacity:0.85}
.course-cover-tag{font-size:9px;color:rgba(255,255,255,0.85);font-weight:500;margin-top:2px}
.course-body{flex:1;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between}
.course-title{font-size:13px;color:#333;line-height:1.4;font-weight:500}
.course-bottom{display:flex;justify-content:space-between;align-items:center}
.course-price{font-size:14px;font-weight:600;color:#E93323}
.course-heart{font-size:16px;cursor:pointer;color:#E93323;padding:4px}
.course-heart:active{transform:scale(1.2)}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:12px 24px;border-radius:8px;font-size:13px;z-index:999;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="phone-frame">
  <div class="notch"></div>
  <div class="phone-screen">
    <div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg width="15" height="11" viewBox="0 0 15 11"><rect x="0" y="7" width="3" height="4" rx="0.5" fill="#000"/><rect x="4" y="5" width="3" height="6" rx="0.5" fill="#000"/><rect x="8" y="3" width="3" height="8" rx="0.5" fill="#000"/><rect x="12" y="0" width="3" height="11" rx="0.5" fill="#000"/></svg><svg width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 2.5C5.2 2.5 3.1 3.3 1.5 4.7L0 3.2C2.1 1.4 4.7 0.5 7.5 0.5S12.9 1.4 15 3.2l-1.5 1.5C11.9 3.3 9.8 2.5 7.5 2.5z" fill="#000"/><path d="M7.5 5.5C6.1 5.5 4.9 6 4 6.8L2.5 5.3C3.9 4.1 5.6 3.5 7.5 3.5s3.6 0.6 5 1.8L11 6.8C10.1 6 8.9 5.5 7.5 5.5z" fill="#000"/><circle cx="7.5" cy="9" r="1.5" fill="#000"/></svg><svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="0" width="21" height="12" rx="2.5" stroke="#000" stroke-width="1" fill="none"/><rect x="2" y="2" width="14" height="8" rx="1" fill="#000"/><rect x="22" y="3.5" width="2" height="5" rx="0.8" fill="#000"/></svg></div></div>
    <div class="nav-bar"><span class="nav-back" onclick="goBack()">←</span><span class="nav-title">我的收藏</span></div>
    <div class="scroll-content">
      <div class="course-list">
        <div class="course-item" onclick="navigateTo('05-course-detail.html')">
          <div class="course-cover" style="background:linear-gradient(135deg,#DC2626,#991B1B)"><span class="course-cover-icon"><svg viewBox="0 0 24 24"><path d="M12 1c-1.5 0-3 1-4 3-1 2-2 4-2.5 5.5C4 13 3 18 3 18c0 2 1 4 4 4h10c3 0 4-2 4-4 0 0-1-5-2.5-8.5C18 8 17 6 16 4c-1-2-2.5-3-4-3z" fill="#FF6B35"/><path d="M8 18c.5 3 1.5 5 4 5s3.5-2 4-5" fill="#FECF6A"/></svg></span><span class="course-cover-tag">消防工程师</span></div>
          <div class="course-body"><div class="course-title">一级消防工程师全科取证班</div><div class="course-bottom"><span class="course-price">¥2999.00</span><span class="course-heart" onclick="event.stopPropagation();unfav(this)" title="取消收藏"><svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M12 21l-1.5-1.4C5.5 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.5 6.9-8.5 11.1L12 21z" fill="#FF6B35"/></svg></span></div></div>
        </div>
        <div class="course-item" onclick="navigateTo('05-course-detail.html')">
          <div class="course-cover" style="background:linear-gradient(135deg,#059669,#047857)"><span class="course-cover-icon"><svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2" fill="#FF9A9E"/><rect x="7" y="4" width="10" height="5" rx="1" fill="#fff" opacity=".4"/></svg></span><span class="course-cover-tag">考研英语</span></div>
          <div class="course-body"><div class="course-title">考研英语全程提升班</div><div class="course-bottom"><span class="course-price">¥998.00</span><span class="course-heart" onclick="event.stopPropagation();unfav(this)" title="取消收藏"><svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M12 21l-1.5-1.4C5.5 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.5 6.9-8.5 11.1L12 21z" fill="#FF6B35"/></svg></span></div></div>
        </div>
        <div class="course-item" onclick="navigateTo('05-course-detail.html')">
          <div class="course-cover" style="background:linear-gradient(135deg,#0D9488,#0F766E)"><span class="course-cover-icon"><svg viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="14" rx="2" fill="#B8C5FF"/><polygon points="4,8 12,1 20,8" fill="#FFD6A5"/></svg></span><span class="course-cover-tag">公务员</span></div>
          <div class="course-body"><div class="course-title">国考笔试精品课</div><div class="course-bottom"><span class="course-price">¥2680.00</span><span class="course-heart" onclick="event.stopPropagation();unfav(this)" title="取消收藏"><svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M12 21l-1.5-1.4C5.5 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.5 6.9-8.5 11.1L12 21z" fill="#FF6B35"/></svg></span></div></div>
        </div>
        <div class="course-item" onclick="navigateTo('05-course-detail.html')">
          <div class="course-cover" style="background:linear-gradient(135deg,#4F46E5,#3730A3)"><span class="course-cover-icon"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="6" stroke="#FF6B35" stroke-width="2" stroke-linecap="round"/><polygon points="9,6 15,6 12,3" fill="#FF6B35"/><path d="M3 12L6 6h12l3 6" fill="none" stroke="#B8C5FF" stroke-width="2"/></svg></span><span class="course-cover-tag">司法考试</span></div>
          <div class="course-body"><div class="course-title">法考客观题全程班</div><div class="course-bottom"><span class="course-price">¥2980.00</span><span class="course-heart" onclick="event.stopPropagation();unfav(this)" title="取消收藏"><svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M12 21l-1.5-1.4C5.5 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.5 6.9-8.5 11.1L12 21z" fill="#FF6B35"/></svg></span></div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div>
<div class="toast" id="toast"></div>
<script>
function navigateTo(url){try{var s=JSON.parse(localStorage.getItem("jd_nav")||"[]");var c=location.pathname.split("/").pop()||"index.html";s.push(c);localStorage.setItem("jd_nav",JSON.stringify(s));}catch(e){}location.href=url;}
function goBack(){try{var s=JSON.parse(localStorage.getItem("jd_nav")||"[]");while(s.length){var p=s.pop();if(p!==(location.pathname.split("/").pop()||"")){localStorage.setItem("jd_nav",JSON.stringify(s));location.href=p;return;}}}catch(e){}location.href="index.html";}
function unfav(el){el.innerHTML='<svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M12 21l-1.5-1.4C5.5 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.5 6.9-8.5 11.1L12 21z" fill="#ddd"/></svg>';el.style.color='#999';showToast('已取消收藏')}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1500)}
</script>
</body>
</html>
