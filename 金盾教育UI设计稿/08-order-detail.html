<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background:#E8E8ED; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
.phone-frame { width:375px; height:812px; background:#0d0d0d; border-radius:44px; position:relative; box-shadow: 0 0 0 3px #1a1a1a, 0 0 0 6px #0d0d0d, 0 0 0 8px #222, 0 12px 50px rgba(0,0,0,0.35); overflow:hidden; }
.phone-screen { position:absolute; top:0; left:0; right:0; bottom:0; background:#F5F5F5; border-radius:40px; overflow:hidden; display:flex; flex-direction:column; }
.notch { position:absolute; top:0; left:50%; transform:translateX(-50%); width:210px; height:30px; background:#0d0d0d; border-radius:0 0 20px 20px; z-index:100; }
.home-indicator { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; background:rgba(0,0,0,0.15); border-radius:3px; z-index:100; }
.status-bar { height:54px; background:#fff; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; font-size:12px; font-weight:600; color:#000; flex-shrink:0; }
.status-time { font-weight:600; }
.status-icons { display:flex; align-items:center; gap:6px; }
.nav-bar { background:#fff; padding:10px 14px; display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600; border-bottom:0.5px solid #F0F0F0; flex-shrink:0; }
.nav-back { cursor:pointer; font-size:16px; color:#333; text-decoration:none; }
.nav-back:active { opacity:0.5; }
.scroll-content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.scroll-content::-webkit-scrollbar { width:0; }
.status-card { background:linear-gradient(135deg,#E93323,#FF6B35); padding:20px 16px; color:#fff; text-align:center; }
.status-icon { font-size:36px; }
.status-text { font-size:18px; font-weight:700; margin-top:6px; }
.status-sub { font-size:12px; opacity:0.8; margin-top:4px; }
.info-card { background:#fff; margin:8px 12px 0; border-radius:10px; overflow:hidden; }
.info-row { display:flex; padding:12px 14px; font-size:12px; color:#666; border-bottom:0.5px solid #F5F5F5; }
.info-row:last-child { border-bottom:none; }
.info-label { color:#999; width:70px; flex-shrink:0; }
.info-value { color:#333; flex:1; }
.course-card { background:#fff; margin:8px 12px 0; border-radius:10px; padding:12px; display:flex; gap:10px; align-items:center; }
.course-img { width:64px; height:64px; border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.course-img-inner { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.course-img-icon { font-size:24px; opacity:0.85; }
.course-img-tag { font-size:7px; color:rgba(255,255,255,0.9); }
.course-name { font-size:13px; color:#333; line-height:1.4; }
.course-price { font-size:12px; color:#999; margin-top:4px; }
.price-card { background:#fff; margin:8px 12px 0; border-radius:10px; overflow:hidden; }
.price-row { display:flex; justify-content:space-between; padding:10px 14px; font-size:12px; color:#666; border-bottom:0.5px solid #F5F5F5; }
.price-row:last-child { border-bottom:none; color:#333; font-weight:600; }
.price-amount { color:#E93323; font-size:16px; font-weight:700; }
.time-card { background:#fff; margin:8px 12px 0; border-radius:10px; overflow:hidden; }
.time-row { padding:10px 14px; font-size:12px; color:#666; border-bottom:0.5px solid #F5F5F5; display:flex; gap:8px; }
.toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.75); color:#fff; padding:12px 24px; border-radius:8px; font-size:13px; z-index:999; pointer-events:none; opacity:0; transition:opacity .2s; }
.toast.show { opacity:1; }
</style>
</head>

<script>
function navigateTo(url){try{var s=JSON.parse(localStorage.getItem("jd_nav")||"[]");var c=location.pathname.split("/").pop()||"index.html";s.push(c);localStorage.setItem("jd_nav",JSON.stringify(s));}catch(e){}location.href=url;}
function goBack(){try{var s=JSON.parse(localStorage.getItem("jd_nav")||"[]");while(s.length){var p=s.pop();if(p!==(location.pathname.split("/").pop()||"")){localStorage.setItem("jd_nav",JSON.stringify(s));location.href=p;return;}}}catch(e){}location.href="index.html";}
function showToast(msg) { var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},1500); }
</script>
