<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单列表 - 金盾教育分销小程序</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background:#E8E8ED; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
.phone-frame { width:375px; height:812px; background:#0d0d0d; border-radius:44px; position:relative; box-shadow: 0 0 0 3px #1a1a1a, 0 0 0 6px #0d0d0d, 0 0 0 8px #222, 0 12px 50px rgba(0,0,0,0.35); overflow:hidden; }
.phone-screen { position:absolute; top:0; left:0; right:0; bottom:0; background:#F5F5F5; border-radius:40px; overflow:hidden; display:flex; flex-direction:column; }
.notch { position:absolute; top:0; left:50%; transform:translateX(-50%); width:210px; height:30px; background:#0d0d0d; border-radius:0 0 20px 20px; z-index:100; }
.home-indicator { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; background:rgba(0,0,0,0.15); border-radius:3px; z-index:100; }
.status-bar { height:54px; background:#fff; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; font-size:12px; font-weight:600; color:#000; flex-shrink:0; }
.status-time { font-weight:600; letter-spacing:0.5px; }
.status-icons { display:flex; align-items:center; gap:6px; }
.scroll-content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.scroll-content::-webkit-scrollbar { width:0; }
.search-bar { background:#fff; padding:10px 14px; cursor:pointer; }
.search-input { display:flex; align-items:center; gap:8px; background:#F5F5F5; border-radius:20px; padding:8px 14px; }
.search-input span { color:#B0B0B0; font-size:13px; }
.tabs { background:#fff; display:flex; border-bottom:0.5px solid #F0F0F0; }
.tab-btn { flex:1; text-align:center; padding:12px 0; font-size:13px; color:#666; cursor:pointer; position:relative; transition:color .15s; }
.tab-btn.active { color:#E93323; font-weight:600; }
.tab-btn.active::after { content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:24px; height:3px; background:#E93323; border-radius:2px; }
.tab-btn:active { background:#FAFAFA; }
.order-list { padding:10px 14px; }
.order-card { background:#fff; border-radius:10px; margin-bottom:10px; overflow:hidden; border:0.5px solid #F0F0F0; }
.order-header { padding:10px 12px; border-bottom:0.5px solid #F5F5F5; font-size:11px; color:#999; display:flex; justify-content:space-between; }
.order-status { color:#E93323; font-weight:500; }
.order-body { padding:10px 12px; display:flex; align-items:center; gap:10px; cursor:pointer; }
.order-body:active { background:#FAFAFA; }
.order-img { width:72px; height:72px; border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.order-img-inner { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.order-img-icon { font-size:28px; opacity:0.85; }
.order-img-tag { font-size:8px; color:rgba(255,255,255,0.9); margin-top:1px; }
.order-info { flex:1; min-width:0; }
.order-name { font-size:13px; color:#333; line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.order-price { font-size:14px; font-weight:600; color:#E93323; margin-top:4px; }
.order-count { font-size:11px; color:#999; margin-top:2px; }
.order-footer { padding:8px 12px; border-top:0.5px solid #F5F5F5; display:flex; justify-content:flex-end; gap:8px; }
.btn { font-size:11px; padding:6px 14px; border-radius:14px; cursor:pointer; transition:opacity .15s; border:none; }
.btn:active { opacity:0.7; }
.btn-outline { background:#fff; color:#E93323; border:0.5px solid #E93323; }
.btn-primary { background:linear-gradient(135deg,#E93323,#FF6B35); color:#fff; }
.tab-bar { display:flex; background:#fff; border-top:0.5px solid #EEE; padding:6px 0 20px; flex-shrink:0; }
.tab-item { flex:1; text-align:center; font-size:10px; padding:4px 0; cursor:pointer; color:#B0B0B0; text-decoration:none; }
.tab-item .tab-icon { width:24px; height:24px; display:block; margin:0 auto 2px; }
.tab-item.active .tab-icon svg { opacity:1; }
.tab-item .tab-icon svg { display:block; width:24px; height:24px; }
.tab-item.active { color:#E93323; }
.tab-item:active { opacity:0.7; }
.toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.75); color:#fff; padding:12px 24px; border-radius:8px; font-size:13px; z-index:999; pointer-events:none; opacity:0; transition:opacity .2s; }
.toast.show { opacity:1; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="notch"></div>
  <div class="phone-screen">

    </div>
    <div class="tab-bar">
      <a class="tab-item" href="01-home.html"><span class="tab-icon"><svg viewBox="0 0 24 24"><defs><linearGradient id="hg3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF6B35"/><stop offset="100%" stop-color="#E93323"/></linearGradient></defs><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1v-9.5z" fill="url(#hg3)"/><rect x="9" y="13" width="6" height="8" rx="2" fill="#FFECD2"/><circle cx="16" cy="11" r="2" fill="#FFECD2"/><rect x="8" y="2" width="3" height="3" rx="1" fill="#FF6B35" opacity=".6"/><circle cx="10" cy="0.5" r="1.5" fill="#FF9A9E"/></svg></span>首页</a>

      <a class="tab-item active" href="03-order-list.html"><span class="tab-icon"><svg viewBox="0 0 24 24"><rect x="3" y="2" width="18" height="20" rx="3" fill="#FFD6A5"/><rect x="7" y="7" width="10" height="2" rx="1" fill="#E93323" opacity=".5"/><rect x="7" y="11" width="8" height="2" rx="1" fill="#E93323" opacity=".5"/><rect x="7" y="15" width="6" height="2" rx="1" fill="#E93323" opacity=".5"/><circle cx="19" cy="18" r="4" fill="#E93323"/><path d="M17.5 18l1 1 2-2" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg></span>订单</a>
      <a class="tab-item" href="04-profile.html"><span class="tab-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="5" fill="#FFB5A7"/><ellipse cx="12" cy="22" rx="9" ry="6" fill="#FFB5A7"/><circle cx="10" cy="7" r="1" fill="#333"/><circle cx="14" cy="7" r="1" fill="#333"/><path d="M9.5 10.5Q12 13 14.5 10.5" stroke="#333" stroke-width="0.8" fill="none" stroke-linecap="round"/><circle cx="12" cy="14" r="1.5" fill="#FF9A9E"/></svg></span>我的</a>

  <div class="home-indicator"></div>
</div>
<div class="toast" id="toast"></div>
<script>
function navigateTo(url){try{var s=JSON.parse(localStorage.getItem("jd_nav")||"[]");var c=location.pathname.split("/").pop()||"index.html";s.push(c);localStorage.setItem("jd_nav",JSON.stringify(s));}catch(e){}location.href=url;}
function showToast(msg) { var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},1500); }
function switchTab(el) { document.querySelectorAll('.tab-btn').forEach(function(i){i.classList.remove('active');}); el.classList.add('active'); }
</script>
</body>
</html>
