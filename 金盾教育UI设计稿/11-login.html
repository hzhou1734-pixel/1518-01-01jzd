<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 金盾教育分销小程序</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background:#E8E8ED; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
.phone-frame { width:375px; height:812px; background:#0d0d0d; border-radius:44px; position:relative; box-shadow: 0 0 0 3px #1a1a1a, 0 0 0 6px #0d0d0d, 0 0 0 8px #222, 0 12px 50px rgba(0,0,0,0.35); overflow:hidden; }
.phone-screen { position:absolute; top:0; left:0; right:0; bottom:0; background:#fff; border-radius:40px; overflow:hidden; display:flex; flex-direction:column; }
.notch { position:absolute; top:0; left:50%; transform:translateX(-50%); width:210px; height:30px; background:#0d0d0d; border-radius:0 0 20px 20px; z-index:100; }
.home-indicator { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; background:rgba(0,0,0,0.15); border-radius:3px; z-index:100; }
.status-bar { height:54px; background:#fff; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; font-size:12px; font-weight:600; color:#000; flex-shrink:0; }
.scroll-content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; }
.scroll-content::-webkit-scrollbar { width:0; }

/* Logo 区域 */
.login-logo { text-align:center; padding:64px 0 40px; }
.login-icon { width:76px; height:76px; border-radius:20px; background:linear-gradient(135deg,#E93323,#FF6B35); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; box-shadow:0 4px 16px rgba(233,51,35,0.3); }
.login-name { font-size:20px; font-weight:700; color:#333; }
.login-sub { font-size:12px; color:#B0B0B0; margin-top:4px; }

/* 登录表单区域 */
.login-form { flex:1; display:flex; flex-direction:column; justify-content:flex-end; padding:0 32px 40px; }

/* 协议勾选 */
.agreement-row { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:20px; cursor:pointer; user-select:none; }
.agreement-check { width:18px; height:18px; border-radius:50%; border:1.5px solid #D0D0D0; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .2s; }
.agreement-check.checked { background:#E93323; border-color:#E93323; }
.agreement-check svg { opacity:0; transition:opacity .15s; }
.agreement-check.checked svg { opacity:1; }
.agreement-text { font-size:12px; color:#999; line-height:1.5; }
.agreement-text span { color:#4A90D9; }

/* 微信登录按钮 */
.wx-login-btn { background:#F5F5F5; border-radius:24px; padding:13px; text-align:center; font-size:14px; font-weight:600; color:#B0B0B0; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:all .25s; border:none; width:100%; }
.wx-login-btn.active { background:linear-gradient(135deg,#2a2a2a,#1a1a1a); color:#fff; box-shadow:0 4px 16px rgba(0,0,0,0.25); }
.wx-login-btn.active:active { opacity:0.85; }
.wx-login-btn .wx-icon-wrap { width:24px; height:24px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .25s; }
.wx-login-btn.active .wx-icon-wrap { background:rgba(255,255,255,0.2); }

.toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.75); color:#fff; padding:12px 24px; border-radius:8px; font-size:13px; z-index:999; pointer-events:none; opacity:0; transition:opacity .2s; }
.toast.show { opacity:1; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="notch"></div>
  <div class="phone-screen">
    <div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg width="15" height="11" viewBox="0 0 15 11"><rect x="0" y="7" width="3" height="4" rx="0.5" fill="#000"/><rect x="4" y="5" width="3" height="6" rx="0.5" fill="#000"/><rect x="8" y="3" width="3" height="8" rx="0.5" fill="#000"/><rect x="12" y="0" width="3" height="11" rx="0.5" fill="#000"/></svg><svg width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 2.5C5.2 2.5 3.1 3.3 1.5 4.7L0 3.2C2.1 1.4 4.7 0.5 7.5 0.5S12.9 1.4 15 3.2l-1.5 1.5C11.9 3.3 9.8 2.5 7.5 2.5z" fill="#000"/><path d="M7.5 5.5C6.1 5.5 4.9 6 4 6.8L2.5 5.3C3.9 4.1 5.6 3.5 7.5 3.5s3.6 0.6 5 1.8L11 6.8C10.1 6 8.9 5.5 7.5 5.5z" fill="#000"/><circle cx="7.5" cy="9" r="1.5" fill="#000"/></svg><svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="0" width="21" height="12" rx="2.5" stroke="#000" stroke-width="1" fill="none"/><rect x="2" y="2" width="14" height="8" rx="1" fill="#000"/><rect x="22" y="3.5" width="2" height="5" rx="0.8" fill="#000"/></svg></div></div>
    <div class="scroll-content">
      <!-- Logo -->
      <div class="login-logo">
        <div class="login-icon">
          <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" fill="#FF6B35"/><text x="12" y="16" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">KD</text></svg>
        </div>
        <div class="login-name">金盾教育</div>
        <div class="login-sub">专业教育培训平台</div>
      </div>

      <!-- 登录表单 -->
      <div class="login-form">
        <!-- 微信授权登录 -->
        <button class="wx-login-btn" id="loginBtn" onclick="doLogin()">
          <span class="wx-icon-wrap">
            <svg width="14" height="13" viewBox="0 0 24 22">
              <path d="M12 0C5.4 0 0 4.2 0 9.5c0 2.8 1.6 5.3 4 6.9l-1 3c-.1.3 0 .6.3.8.2.1.4.1.6 0l3.5-1.7c1.4.4 2.9.6 4.6.6 6.6 0 12-4.2 12-9.5S18.6 0 12 0z" fill="#07C160"/>
              <ellipse cx="8.5" cy="8.5" rx="1.2" ry="1.4" fill="#fff"/>
              <ellipse cx="15.5" cy="8.5" rx="1.2" ry="1.4" fill="#fff"/>
            </svg>
          </span>
          微信授权登录
        </button>
        <!-- 协议勾选 -->
        <div class="agreement-row" onclick="toggleAgree()">
          <div class="agreement-check" id="agreeCheck">
            <svg width="12" height="10" viewBox="0 0 12 10"><path d="M1 5l3 3 7-7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <span class="agreement-text">我已阅读并同意<span onclick="event.stopPropagation();showToast('用户协议')">《用户协议》</span>和<span onclick="event.stopPropagation();showToast('隐私政策')">《隐私政策》</span></span>
        </div>
      </div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div>
<div class="toast" id="toast"></div>
<script>
var agreed = false;

function toggleAgree() {
  agreed = !agreed;
  var check = document.getElementById('agreeCheck');
  var btn = document.getElementById('loginBtn');
  if (agreed) {
    check.classList.add('checked');
    btn.classList.add('active');
  } else {
    check.classList.remove('checked');
    btn.classList.remove('active');
  }
}

function navigateTo(url){try{var s=JSON.parse(localStorage.getItem("jd_nav")||"[]");var c=location.pathname.split("/").pop()||"index.html";s.push(c);localStorage.setItem("jd_nav",JSON.stringify(s));}catch(e){}location.href=url;}
function showToast(msg) { var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},1500); }
function doLogin() {
  if (!agreed) { showToast('请先阅读并同意用户协议'); return; }
  showToast('登录成功');
  setTimeout(function(){ navigateTo('01-home.html'); }, 1200);
}
</script>
</body>
</html>
