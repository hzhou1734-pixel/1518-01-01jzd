<style>
* { margin:0; padding:0; box-sizing:border-box; }

.notch { position:absolute; top:0; left:50%; transform:translateX(-50%); width:210px; height:30px; background:#0d0d0d; border-radius:0 0 20px 20px; z-index:100; }
.home-indicator { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; background:rgba(0,0,0,0.15); border-radius:3px; z-index:100; }
.status-bar { height:54px; background:linear-gradient(180deg,#FFFAF8,#FFF); display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px 10px; font-size:12px; font-weight:600; color:#000; flex-shrink:0; }
.status-time { font-weight:600; letter-spacing:0.5px; }
.status-icons { display:flex; align-items:center; gap:6px; }

.page-title { font-size:16px; font-weight:600; color:#333; }
.page-header-right { position:absolute; right:16px; top:50%; transform:translateY(-50%); display:flex; align-items:center; }
.search-bar { background:#fff; padding:10px 14px; cursor:pointer; flex-shrink:0; }
.search-input { display:flex; align-items:center; gap:8px; background:#F5F5F5; border-radius:20px; padding:8px 14px; }
.search-input span { color:#B0B0B0; font-size:13px; }
.search-input .search-icon { width:16px; height:16px; flex-shrink:0; }
.category-body { flex:1; display:flex; overflow:hidden; }
/* 左侧一级分类 */
.left-nav { width:90px; background:#F8F8F8; overflow-y:auto; flex-shrink:0; }
.left-nav::-webkit-scrollbar { width:0; }
.left-item { padding:14px 10px; text-align:center; font-size:13px; color:#666; cursor:pointer; position:relative; transition:background .15s; white-space:nowrap; }
.left-item.active { background:#fff; color:#E93323; font-weight:600; }
.left-item.active::before { content:''; position:absolute; left:0; top:8px; bottom:8px; width:3px; background:#E93323; border-radius:0 2px 2px 0; }
.left-item:active { background:#fff; }
/* 右侧内容区 */
.right-panel { flex:1; background:#fff; overflow-y:auto; display:flex; flex-direction:column; }
.right-panel::-webkit-scrollbar { width:0; }
/* 二级分类标签行 */
.sub-cat-row { padding:12px 12px 0; flex-shrink:0; }
.sub-cat-scroll { display:flex; flex-wrap:wrap; gap:8px; }
.sub-cat-tag { display:inline-block; padding:6px 14px; border-radius:16px; font-size:12px; color:#666; background:#F5F5F5; cursor:pointer; transition:all .15s; white-space:nowrap; border:0.5px solid transparent; }
.sub-cat-tag.active { color:#E93323; background:#FFF0ED; border-color:#E93323; font-weight:500; }
.sub-cat-tag:active { transform:scale(0.95); }
/* 课程列表 */
.course-section { flex:1; padding:10px 12px 16px; overflow-y:auto; }
.course-section::-webkit-scrollbar { width:0; }
.course-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.course-card { border-radius:8px; overflow:hidden; border:0.5px solid #F0F0F0; cursor:pointer; transition:transform .15s; background:#fff; }
.course-card:active { transform:scale(0.97); }
.course-img { height:100px; display:flex; align-items:center; justify-content:center; }
.course-img-inner { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.course-img-icon { font-size:28px; opacity:0.85; }
.course-img-tag { font-size:9px; color:rgba(255,255,255,0.9); font-weight:500; margin-top:2px; }
.course-info { padding:6px 8px 8px; }
.course-name { font-size:11px; color:#333; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.course-price { font-size:13px; font-weight:600; color:#E93323; margin-top:4px; }
.course-price .original { font-size:10px; color:#B0B0B0; text-decoration:line-through; font-weight:400; margin-left:4px; }
/* 空状态 */
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; text-align:center; }
.empty-state-icon { font-size:48px; margin-bottom:12px; opacity:0.4; }
.empty-state-text { font-size:13px; color:#B0B0B0; }
/* 底部导航 */
.tab-bar { display:flex; background:#fff; border-top:0.5px solid #EEE; padding:6px 0 20px; flex-shrink:0; }
.tab-item { flex:1; text-align:center; font-size:10px; padding:4px 0; cursor:pointer; color:#B0B0B0; text-decoration:none; transition:color .15s; }
.tab-item .tab-icon { width:24px; height:24px; display:block; margin:0 auto 2px; }
.tab-item .tab-icon svg { display:block; width:24px; height:24px; filter:grayscale(1); opacity:0.45; transition:filter .2s, opacity .2s; }
.tab-item.active .tab-icon svg { filter:none; opacity:1; }
.tab-item.active { color:#E93323; }
.tab-item:active { opacity:0.7; }
.toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.75); color:#fff; padding:12px 24px; border-radius:8px; font-size:13px; z-index:999; pointer-events:none; opacity:0; transition:opacity .2s; }
.toast.show { opacity:1; }
</style>
</head>

var currentPrimary = 0;
var currentSub = 0;

function renderSubCats(primaryIndex) {
  var cat = categoryData[primaryIndex];
  var html = '';
  cat.subs.forEach(function(sub, i) {
    html += '<span class="sub-cat-tag' + (i === 0 ? ' active' : '') + '" data-sub="' + i + '" onclick="switchSub(this, ' + i + ')">' + sub + '</span>';
  });
  document.getElementById('subCatScroll').innerHTML = html;
}

function renderCourses(primaryIndex, subIndex) {
  var cat = categoryData[primaryIndex];
  var courses = cat.courses;
  // 全部课程一级分类不按二级筛选，其他按二级标签索引筛选
  if (primaryIndex !== 0 && subIndex > 0) {
    courses = courses.filter(function(c) { return c.sub === subIndex; });
  }
  if (courses.length === 0) {
    document.getElementById('courseGrid').innerHTML = '<div class="empty-state"><div class="empty-state-icon"><svg viewBox="0 0 24 24" width="48" height="48"><rect x="2" y="6" width="20" height="14" rx="3" fill="#B8C5FF" opacity=".5"/><path d="M2 7L12 14l10-7" stroke="#B8C5FF" stroke-width="1.5" fill="none"/></svg></div><div class="empty-state-text">暂无相关课程</div></div>';
    return;
  }
  var html = '';
  courses.forEach(function(c) {
    html += '<div class="course-card" onclick="navigateTo(\'05-course-detail.html\')">'
      + '<div class="course-img" style="background:linear-gradient(135deg,' + c.gradient + ');">'
      + '<div class="course-img-inner"><span class="course-img-icon">' + c.icon + '</span><span class="course-img-tag">' + c.tag + '</span></div></div>'
      + '<div class="course-info"><div class="course-name">' + c.name + '</div>'
      + '<div class="course-price">&yen;' + c.price.toFixed(2) + '<span class="original">&yen;' + c.oriPrice.toFixed(2) + '</span></div>'
      + '</div></div>';
  });
  document.getElementById('courseGrid').innerHTML = html;
}

function switchPrimary(el, index) {
  document.querySelectorAll('.left-item').forEach(function(i) { i.classList.remove('active'); });
  el.classList.add('active');
  currentPrimary = index;
  currentSub = 0;
  renderSubCats(index);
  renderCourses(index, 0);
}

function switchSub(el, index) {
  document.querySelectorAll('.sub-cat-tag').forEach(function(i) { i.classList.remove('active'); });
  el.classList.add('active');
  currentSub = index;
  renderCourses(currentPrimary, index);
}

// 初始化
renderSubCats(0);
renderCourses(0, 0);
