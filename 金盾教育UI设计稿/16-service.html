<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电话客服 - 金盾教育分销小程序</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#E8E8ED;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.phone-frame{width:375px;height:812px;background:#0d0d0d;border-radius:44px;position:relative;box-shadow:0 0 0 3px #1a1a1a,0 0 0 6px #0d0d0d,0 0 0 8px #222,0 12px 50px rgba(0,0,0,0.35);overflow:hidden}
.phone-screen{position:absolute;top:0;left:0;right:0;bottom:0;background:#F5F5F5;border-radius:40px;overflow:hidden;display:flex;flex-direction:column}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:210px;height:30px;background:#0d0d0d;border-radius:0 0 20px 20px;z-index:100}
.home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:rgba(0,0,0,0.15);border-radius:3px;z-index:100}
.status-bar{height:54px;background:linear-gradient(180deg,#FFFAF8,#FFF);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px 10px;font-size:12px;font-weight:600;flex-shrink:0}
.status-time{font-weight:600;letter-spacing:0.5px}
.status-icons{display:flex;align-items:center;gap:6px}
.nav-bar{height:44px;background:linear-gradient(180deg,#FFFDFA,#FFF);display:flex;align-items:center;padding:0 12px;flex-shrink:0;border-bottom:1px solid rgba(233,51,35,0.06)}
.nav-back{font-size:20px;color:#333;cursor:pointer;padding:6px 8px;text-decoration:none}
.nav-back:active{opacity:0.5}
.nav-title{flex:1;text-align:center;font-size:15px;font-weight:600;color:#000;padding-right:40px}
.scroll-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll-content::-webkit-scrollbar{width:0}

/* 头部 */
.service-hero{background:linear-gradient(135deg,#E93323,#FF6B35);padding:28px 16px 24px;text-align:center;color:#fff}
.service-hero-icon{width:56px;height:56px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.service-hero-title{font-size:18px;font-weight:600;margin-bottom:4px}
.service-hero-sub{font-size:12px;opacity:0.85}

/* 电话列表 */
.phone-section{padding:16px 12px 0}
.phone-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .15s}
.phone-card:active{transform:scale(0.98)}
.phone-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.phone-icon.primary{background:linear-gradient(135deg,#E93323,#FF6B35)}
.phone-icon.secondary{background:linear-gradient(135deg,#FF9A9E,#FFB5A7)}
.phone-info{flex:1;min-width:0}
.phone-label{font-size:14px;font-weight:500;color:#333;margin-bottom:2px}
.phone-number{font-size:12px;color:#999}
.phone-arrow{font-size:16px;color:#C0C0C0;flex-shrink:0}

/* 弹窗 */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:998;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}
.dialog{background:#fff;border-radius:16px;width:290px;overflow:hidden;text-align:center;transform:translateY(20px);transition:transform .25s}
.overlay.show .dialog{transform:translateY(0)}
.dialog-header{background:linear-gradient(135deg,#E93323,#FF6B35);padding:20px 16px;color:#fff}
.dialog-header-icon{width:48px;height:48px;background:rgba(255,255,255,0.25);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.dialog-header-title{font-size:13px;opacity:0.9;margin-bottom:6px}
.dialog-phone{font-size:26px;font-weight:700;letter-spacing:1px}
.dialog-body{padding:20px 16px}
.dialog-body-label{font-size:12px;color:#999;margin-bottom:2px}
.dialog-body-time{font-size:13px;color:#666}
.dialog-footer{display:flex;border-top:0.5px solid #EEE}
.dialog-btn{flex:1;padding:14px 0;font-size:14px;cursor:pointer;border:none;background:none;font-family:inherit;transition:background .15s}
.dialog-btn:active{background:#F5F5F5}
.dialog-btn.cancel{color:#999}
.dialog-btn.call{color:#07C160;font-weight:600;border-left:0.5px solid #EEE}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:12px 24px;border-radius:8px;font-size:13px;z-index:999;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="phone-frame">
  <div class="notch"></div>
  <div class="phone-screen">
    <div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg width="15" height="11" viewBox="0 0 15 11"><rect x="0" y="7" width="3" height="4" rx="0.5" fill="#000"/><rect x="4" y="5" width="3" height="6" rx="0.5" fill="#000"/><rect x="8" y="3" width="3" height="8" rx="0.5" fill="#000"/><rect x="12" y="0" width="3" height="11" rx="0.5" fill="#000"/></svg><svg width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 2.5C5.2 2.5 3.1 3.3 1.5 4.7L0 3.2C2.1 1.4 4.7 0.5 7.5 0.5S12.9 1.4 15 3.2l-1.5 1.5C11.9 3.3 9.8 2.5 7.5 2.5z" fill="#000"/><path d="M7.5 5.5C6.1 5.5 4.9 6 4 6.8L2.5 5.3C3.9 4.1 5.6 3.5 7.5 3.5s3.6 0.6 5 1.8L11 6.8C10.1 6 8.9 5.5 7.5 5.5z" fill="#000"/><circle cx="7.5" cy="9" r="1.5" fill="#000"/></svg><svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="0" width="21" height="12" rx="2.5" stroke="#000" stroke-width="1" fill="none"/><rect x="2" y="2" width="14" height="8" rx="1" fill="#000"/><rect x="22" y="3.5" width="2" height="5" rx="0.8" fill="#000"/></svg></div></div>
    <div class="nav-bar"><span class="nav-back" onclick="goBack()">←</span><span class="nav-title">电话客服</span></div>
    <div class="service-hero">
      <div class="service-hero-icon">
        <svg viewBox="0 0 24 24" style="width:28px;height:28px"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.36 11.36 0 003.58.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.36 11.36 0 00.57 3.58 1 1 0 01-.25 1.01l-2.2 2.2z" fill="#fff"/></svg>
      </div>
      <div class="service-hero-title">金盾教育电话客服</div>
      <div class="service-hero-sub">服务时间：周一至周日 9:00-21:00</div>
    </div>
    <div class="scroll-content">
      <div class="phone-section">
        <div class="phone-card" onclick="openDialog('tel1')">
          <div class="phone-icon primary">
            <svg viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.36 11.36 0 003.58.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.36 11.36 0 00.57 3.58 1 1 0 01-.25 1.01l-2.2 2.2z" fill="#fff" opacity=".9"/></svg>
          </div>
          <div class="phone-info">
            <div class="phone-label">客服热线</div>
            <div class="phone-number">400-888-6688</div>
          </div>
          <span class="phone-arrow">›</span>
        </div>
        <div class="phone-card" onclick="openDialog('tel2')">
          <div class="phone-icon secondary">
            <svg viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.36 11.36 0 003.58.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.36 11.36 0 00.57 3.58 1 1 0 01-.25 1.01l-2.2 2.2z" fill="#fff" opacity=".9"/></svg>
          </div>
          <div class="phone-info">
            <div class="phone-label">投诉与建议</div>
            <div class="phone-number">400-888-6699</div>
          </div>
          <span class="phone-arrow">›</span>
        </div>
      </div>
      <div style="height:40px"></div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div>

<!-- 拨号弹窗 -->
<div class="overlay" id="overlay" onclick="closeDialog()">
  <div class="dialog" id="dialog" onclick="event.stopPropagation()">
    <div class="dialog-header">
      <div class="dialog-header-icon">
        <svg viewBox="0 0 24 24" style="width:24px;height:24px"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.36 11.36 0 003.58.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.36 11.36 0 00.57 3.58 1 1 0 01-.25 1.01l-2.2 2.2z" fill="#fff"/></svg>
      </div>
      <div class="dialog-header-title" id="dialogTitle">客服热线</div>
      <div class="dialog-phone" id="dialogPhone">400-888-6688</div>
    </div>
    <div class="dialog-body">
      <div class="dialog-body-label">服务时间</div>
      <div class="dialog-body-time">周一至周日 9:00-21:00</div>
    </div>
    <div class="dialog-footer">
      <button class="dialog-btn cancel" onclick="closeDialog()">取消</button>
      <a class="dialog-btn call" id="dialLink" href="tel:4008886688">拨打</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
function navigateTo(url){try{var s=JSON.parse(localStorage.getItem("jd_nav")||"[]");var c=location.pathname.split("/").pop()||"index.html";s.push(c);localStorage.setItem("jd_nav",JSON.stringify(s));}catch(e){}location.href=url;}
function goBack(){try{var s=JSON.parse(localStorage.getItem("jd_nav")||"[]");while(s.length){var p=s.pop();if(p!==(location.pathname.split("/").pop()||"")){localStorage.setItem("jd_nav",JSON.stringify(s));location.href=p;return;}}}catch(e){}location.href="index.html";}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1500)}

var phoneData = {
  tel1: { label: '客服热线', number: '400-888-6688', href: 'tel:4008886688' },
  tel2: { label: '投诉与建议', number: '400-888-6699', href: 'tel:4008886699' }
};

function openDialog(key){
  var d = phoneData[key];
  document.getElementById('dialogTitle').textContent = d.label;
  document.getElementById('dialogPhone').textContent = d.number;
  document.getElementById('dialLink').href = d.href;
  document.getElementById('overlay').classList.add('show');
}

function closeDialog(){
  document.getElementById('overlay').classList.remove('show');
}
</script>
</body>
</html>
