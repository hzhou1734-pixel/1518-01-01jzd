<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>优惠券 - 金盾教育分销小程序</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#E8E8ED;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.phone-frame{width:375px;height:812px;background:#0d0d0d;border-radius:44px;position:relative;box-shadow:0 0 0 3px #1a1a1a,0 0 0 6px #0d0d0d,0 0 0 8px #222,0 12px 50px rgba(0,0,0,0.35);overflow:hidden}
.phone-screen{position:absolute;top:0;left:0;right:0;bottom:0;background:#F5F5F5;border-radius:40px;overflow:hidden;display:flex;flex-direction:column}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:210px;height:30px;background:#0d0d0d;border-radius:0 0 20px 20px;z-index:100}
.home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:rgba(0,0,0,0.15);border-radius:3px;z-index:100}
.status-bar{height:54px;background:linear-gradient(180deg,#FFFAF8,#FFF);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px 10px;font-size:12px;font-weight:600;flex-shrink:0}
.status-time{font-weight:600;letter-spacing:0.5px}
.status-icons{display:flex;align-items:center;gap:6px}
.nav-bar{height:44px;background:linear-gradient(180deg,#FFFDFA,#FFF);display:flex;align-items:center;padding:0 12px;flex-shrink:0;border-bottom:1px solid rgba(233,51,35,0.06)}
.nav-back{font-size:20px;color:#333;cursor:pointer;padding:6px 8px;text-decoration:none}
.nav-back:active{opacity:0.5}
.nav-title{flex:1;text-align:center;font-size:15px;font-weight:600;color:#000;padding-right:40px}
.scroll-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll-content::-webkit-scrollbar{width:0}
.tab-row{display:flex;background:#fff;padding:0 12px;border-bottom:0.5px solid #EEE;flex-shrink:0}
.tab-btn{flex:1;text-align:center;padding:12px 0;font-size:13px;color:#666;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab-btn.active{color:#E93323;border-bottom-color:#E93323;font-weight:500}
.coupon-list{padding:10px 12px}
.coupon-card{background:#fff;border-radius:10px;margin-bottom:10px;display:flex;overflow:hidden;border:0.5px solid #F0F0F0}
.coupon-left{width:90px;background:linear-gradient(135deg,#E93323,#FF6B35);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.coupon-left::after{content:'';position:absolute;right:-6px;top:6px;width:12px;height:12px;background:#F5F5F5;border-radius:50%}
.coupon-left::before{content:'';position:absolute;right:-6px;bottom:6px;width:12px;height:12px;background:#F5F5F5;border-radius:50%}
.coupon-amount{font-size:22px;font-weight:700}
.coupon-amount-small{font-size:12px}
.coupon-condition{font-size:10px;opacity:0.85;margin-top:2px}
.coupon-right{flex:1;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between}
.coupon-name{font-size:13px;color:#333;font-weight:500}
.coupon-scope{font-size:10px;color:#999;margin-top:3px}
.coupon-expire{font-size:10px;color:#B0B0B0}
.coupon-used{background:linear-gradient(135deg,#A8BBC8,#8EA3B0)}
.coupon-used .coupon-name,.coupon-used .coupon-scope{color:#6B7D8A}
.coupon-used .coupon-expire{color:#8EA3B0}
.coupon-expired{background:linear-gradient(135deg,#E5DED6,#D3C9BE)}
.coupon-expired .coupon-name,.coupon-expired .coupon-scope{color:#A89880}
.coupon-expired .coupon-expire{color:#C4B8A8}
.coupon-expired .coupon-amount{text-decoration:line-through;opacity:0.6}
.coupon-card[style*="display:none"]{display:none !important}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:12px 24px;border-radius:8px;font-size:13px;z-index:999;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="phone-frame">
  <div class="notch"></div>
  <div class="phone-screen">
    <div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg width="15" height="11" viewBox="0 0 15 11"><rect x="0" y="7" width="3" height="4" rx="0.5" fill="#000"/><rect x="4" y="5" width="3" height="6" rx="0.5" fill="#000"/><rect x="8" y="3" width="3" height="8" rx="0.5" fill="#000"/><rect x="12" y="0" width="3" height="11" rx="0.5" fill="#000"/></svg><svg width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 2.5C5.2 2.5 3.1 3.3 1.5 4.7L0 3.2C2.1 1.4 4.7 0.5 7.5 0.5S12.9 1.4 15 3.2l-1.5 1.5C11.9 3.3 9.8 2.5 7.5 2.5z" fill="#000"/><path d="M7.5 5.5C6.1 5.5 4.9 6 4 6.8L2.5 5.3C3.9 4.1 5.6 3.5 7.5 3.5s3.6 0.6 5 1.8L11 6.8C10.1 6 8.9 5.5 7.5 5.5z" fill="#000"/><circle cx="7.5" cy="9" r="1.5" fill="#000"/></svg><svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="0" width="21" height="12" rx="2.5" stroke="#000" stroke-width="1" fill="none"/><rect x="2" y="2" width="14" height="8" rx="1" fill="#000"/><rect x="22" y="3.5" width="2" height="5" rx="0.8" fill="#000"/></svg></div></div>
    <div class="nav-bar"><span class="nav-back" onclick="goBack()">←</span><span class="nav-title">优惠券</span></div>
    <div class="tab-row">
      <div class="tab-btn active" onclick="switchTab(this)">未使用</div>
      <div class="tab-btn" onclick="switchTab(this)">已使用</div>
      <div class="tab-btn" onclick="switchTab(this)">已过期</div>
    </div>
    <div class="scroll-content">
      <div class="coupon-list">
        <div class="coupon-card" data-status="unused" onclick="showToast('去使用')">
          <div class="coupon-left"><span class="coupon-amount">&yen;<span style="font-size:28px;">50</span></span><span class="coupon-condition">满500可用</span></div>
          <div class="coupon-right"><div class="coupon-name">新人专享优惠券</div><div class="coupon-scope">全部课程可用</div><div class="coupon-expire">有效期至 2026-07-31</div></div>
        </div>
        <div class="coupon-card" data-status="unused" onclick="showToast('去使用')">
          <div class="coupon-left"><span class="coupon-amount">&yen;<span style="font-size:28px;">100</span></span><span class="coupon-condition">满1000可用</span></div>
          <div class="coupon-right"><div class="coupon-name">满减通用券</div><div class="coupon-scope">全部课程可用</div><div class="coupon-expire">有效期至 2026-08-15</div></div>
        </div>
        <div class="coupon-card" data-status="unused" onclick="showToast('去使用')">
          <div class="coupon-left"><span class="coupon-amount">&yen;<span style="font-size:28px;">200</span></span><span class="coupon-condition">满2000可用</span></div>
          <div class="coupon-right"><div class="coupon-name">限时大促券</div><div class="coupon-scope">指定课程可用</div><div class="coupon-expire">有效期至 2026-06-30</div></div>
        </div>
        <div class="coupon-card coupon-used" data-status="used">
          <div class="coupon-left coupon-used"><span class="coupon-amount">&yen;<span style="font-size:28px;">30</span></span><span class="coupon-condition">已使用</span></div>
          <div class="coupon-right coupon-used"><div class="coupon-name">首单立减券</div><div class="coupon-scope">已使用于 消防工程师全科班</div><div class="coupon-expire">使用时间 2026-05-20</div></div>
        </div>
        <div class="coupon-card coupon-expired" data-status="expired">
          <div class="coupon-left coupon-expired"><span class="coupon-amount">&yen;<span style="font-size:28px;">15</span></span><span class="coupon-condition">已过期</span></div>
          <div class="coupon-right coupon-expired"><div class="coupon-name">开学季专属券</div><div class="coupon-scope">全部课程可用</div><div class="coupon-expire">过期时间 2026-04-30</div></div>
        </div>
        <div class="coupon-card coupon-expired" data-status="expired">
          <div class="coupon-left coupon-expired"><span class="coupon-amount">&yen;<span style="font-size:28px;">80</span></span><span class="coupon-condition">已过期</span></div>
          <div class="coupon-right coupon-expired"><div class="coupon-name">周年庆感恩券</div><div class="coupon-scope">指定课程可用</div><div class="coupon-expire">过期时间 2026-03-15</div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div>
<div class="toast" id="toast"></div>
<script>
function navigateTo(url){try{var s=JSON.parse(localStorage.getItem("jd_nav")||"[]");var c=location.pathname.split("/").pop()||"index.html";s.push(c);localStorage.setItem("jd_nav",JSON.stringify(s));}catch(e){}location.href=url;}
function goBack(){try{var s=JSON.parse(localStorage.getItem("jd_nav")||"[]");while(s.length){var p=s.pop();if(p!==(location.pathname.split("/").pop()||"")){localStorage.setItem("jd_nav",JSON.stringify(s));location.href=p;return;}}}catch(e){}location.href="index.html";}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1500)}
function switchTab(el){
  document.querySelectorAll('.tab-btn').forEach(function(i){i.classList.remove('active')});
  el.classList.add('active');
  var tab = el.textContent.trim();
  var map = {'未使用':'unused','已使用':'used','已过期':'expired'};
  var status = map[tab];
  document.querySelectorAll('.coupon-card').forEach(function(c){
    c.style.display = c.dataset.status === status ? 'flex' : 'none';
  });
}
// 初始仅显示未使用
document.querySelectorAll('.coupon-card').forEach(function(c){
  c.style.display = c.dataset.status === 'unused' ? 'flex' : 'none';
});
</script>
</body>
</html>
