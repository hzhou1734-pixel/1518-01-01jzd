<title>我的 - 金盾教育分销小程序</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background:#E8E8ED; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
.phone-frame { width:375px; height:812px; background:#0d0d0d; border-radius:44px; position:relative; box-shadow: 0 0 0 3px #1a1a1a, 0 0 0 6px #0d0d0d, 0 0 0 8px #222, 0 12px 50px rgba(0,0,0,0.35); overflow:hidden; }
.phone-screen { position:absolute; top:0; left:0; right:0; bottom:0; background:#F5F5F5; border-radius:40px; overflow:hidden; display:flex; flex-direction:column; }
.notch { position:absolute; top:0; left:50%; transform:translateX(-50%); width:210px; height:30px; background:#0d0d0d; border-radius:0 0 20px 20px; z-index:100; }
.home-indicator { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; background:rgba(0,0,0,0.15); border-radius:3px; z-index:100; }

/* 状态栏 & 页头 */
.header-group { background:linear-gradient(135deg,#D82A1E,#E93323 30%,#FF6B35); flex-shrink:0; position:relative; }
.status-bar { height:54px; background:transparent; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px 10px; font-size:12px; font-weight:600; color:#fff; position:relative; }
.status-bar::after { content:''; position:absolute; bottom:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent); pointer-events:none; }
.status-icons { display:flex; align-items:center; gap:6px; }

/* 页头 */
.page-header { height:44px; background:transparent; display:flex; align-items:center; justify-content:center; position:relative; padding:0 16px; box-shadow:0 2px 12px rgba(233,51,35,0.15); }
.page-title { font-size:16px; font-weight:600; color:#fff; position:relative; z-index:1; }
.page-header::before { content:''; position:absolute; top:0; right:20px; width:60px; height:60px; border-radius:50%; background:rgba(255,255,255,0.04); pointer-events:none; }
.page-header-right { position:absolute; right:16px; top:50%; transform:translateY(-50%); display:flex; align-items:center; }

.scroll-content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:8px; }
.scroll-content::-webkit-scrollbar { width:0; }

/* 个人信息头部 */
.profile-header { background:linear-gradient(135deg,#E93323,#FF6B35); padding:0 16px 18px; display:flex; align-items:center; gap:12px; color:#fff; cursor:pointer; }
.profile-header:active { opacity:0.9; }
.avatar { width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,0.2); border:2px solid rgba(255,255,255,0.5); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; }
.avatar svg { width:44px; height:44px; display:block; }
.profile-name { font-size:16px; font-weight:600; }
.profile-meta { font-size:11px; opacity:0.8; margin-top:3px; }
.profile-arrow { margin-left:auto; opacity:0.6; font-size:20px; }

/* 订单快捷栏 */
.order-bar { background:#fff; margin:-10px 12px 0; border-radius:12px; display:flex; padding:16px 0; box-shadow:0 2px 12px rgba(0,0,0,0.05); position:relative; z-index:1; }
.order-item { flex:1; text-align:center; cursor:pointer; transition:opacity .15s; }
.order-item:active { opacity:0.5; }
.order-icon { display:block; margin-bottom:6px; }
.order-icon svg { width:24px; height:24px; display:block; margin:0 auto; }
.order-label { font-size:11px; color:#666; }

/* 分区标题 */
.section-label { font-size:12px; color:#999; padding:16px 16px 8px; font-weight:500; }

/* 统一菜单组 */
.menu-group { background:#fff; margin:0 12px; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.03); }
.menu-row { display:flex; align-items:center; padding:14px 16px; cursor:pointer; border-bottom:0.5px solid #F0F0F0; transition:background .15s; }
.menu-row:active { background:#FAFAFA; }
.menu-row:last-child { border-bottom:none; }
.menu-icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-right:12px; }
.menu-icon svg { width:22px; height:22px; display:block; }
.menu-icon.ic-coral { background:#FFF0ED; }
.menu-icon.ic-amber { background:#FFF8EC; }
.menu-icon.ic-blue { background:#F0F4FF; }
.menu-icon.ic-mint { background:#EDFAF4; }
.menu-icon.ic-pink { background:#FFF0F5; }
.menu-info { flex:1; min-width:0; }
.menu-title { font-size:14px; color:#333; font-weight:500; }
.menu-desc { font-size:11px; color:#999; margin-top:2px; }
.menu-extra { text-align:right; flex-shrink:0; margin-left:10px; display:flex; align-items:center; gap:6px; }
.menu-badge { background:#E93323; color:#fff; font-size:10px; padding:2px 8px; border-radius:10px; white-space:nowrap; }
.menu-arrow { color:#C0C0C0; font-size:18px; flex-shrink:0; }


/* 退出登录 */
.logout-area { text-align:center; padding:18px 16px 24px; }
.logout-link { font-size:13px; color:#B0B0B0; cursor:pointer; transition:color .15s; }
.logout-link:active { color:#999; }

/* 底部Tab */
.tab-bar { display:flex; background:#fff; border-top:0.5px solid #EEE; padding:6px 0 20px; flex-shrink:0; }
.tab-item { flex:1; text-align:center; font-size:10px; padding:4px 0; cursor:pointer; color:#B0B0B0; text-decoration:none; }
.tab-item .tab-icon { width:24px; height:24px; display:block; margin:0 auto 2px; }
.tab-item .tab-icon svg { display:block; width:24px; height:24px; filter:grayscale(1); opacity:0.45; transition:filter .2s, opacity .2s; }
.tab-item.active .tab-icon svg { filter:none; opacity:1; }
.tab-item.active { color:#E93323; }
.tab-item:active { opacity:0.7; }

.toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.75); color:#fff; padding:12px 24px; border-radius:8px; font-size:13px; z-index:999; pointer-events:none; opacity:0; transition:opacity .2s; }
.toast.show { opacity:1; }
</style>
</head>
