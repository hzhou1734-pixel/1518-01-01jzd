.scroll-content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }

.profile-header { background:linear-gradient(135deg,#E93323,#FF6B35); padding:16px 16px 20px; display:flex; align-items:center; gap:12px; color:#fff; cursor:pointer; }

.avatar { width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,0.2); border:2px solid rgba(255,255,255,0.5); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; }
.avatar svg { width:44px; height:44px; display:block; }
.profile-name { font-size:16px; font-weight:600; }
.profile-meta { font-size:11px; opacity:0.8; margin-top:3px; }
.order-bar { background:#fff; margin:-10px 12px 0; border-radius:10px; display:flex; padding:14px 0; box-shadow:0 2px 8px rgba(0,0,0,0.06); position:relative; z-index:1; }
.order-item { flex:1; text-align:center; cursor:pointer; transition:opacity .15s; }
.order-item:active { opacity:0.5; }
.order-icon { display:block; margin-bottom:4px; }
.order-icon svg { width:24px; height:24px; display:block; margin:0 auto; }
.order-label { font-size:11px; color:#666; }
.menu-group { background:#fff; margin:10px 12px 0; border-radius:10px; overflow:hidden; }
.menu-row { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; cursor:pointer; border-bottom:0.5px solid #F5F5F5; transition:background .15s; }
.menu-row:active { background:#FAFAFA; }
.menu-row:last-child { border-bottom:none; }
.menu-label { font-size:13px; color:#333; display:flex; align-items:center; gap:8px; }
.menu-icon { line-height:1; }
.menu-icon svg { width:20px; height:20px; display:block; }
.menu-arrow { color:#C0C0C0; font-size:16px; }
.menu-badge { background:#E93323; color:#fff; font-size:10px; padding:2px 8px; border-radius:10px; }
.agent-btn { background:#fff; margin:10px 12px 0; border-radius:10px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; background:linear-gradient(135deg,#FFF8F0,#FFF3E8); }
.agent-btn:active { opacity:0.8; }
.agent-label { font-size:14px; font-weight:600; color:#E65100; display:flex; align-items:center; gap:6px; }
.agent-label svg { width:20px; height:20px; flex-shrink:0; }
.agent-sub { font-size:10px; color:#FF9800; }
.logout { text-align:center; padding:20px; color:#B0B0B0; font-size:12px; cursor:pointer; }
.tab-bar { display:flex; background:#fff; border-top:0.5px solid #EEE; padding:6px 0 20px; flex-shrink:0; }
.tab-item { flex:1; text-align:center; font-size:10px; padding:4px 0; cursor:pointer; color:#B0B0B0; text-decoration:none; }
.tab-item .tab-icon { width:24px; height:24px; display:block; margin:0 auto 2px; }
.tab-item.active .tab-icon svg { opacity:1; }
.tab-item .tab-icon svg { display:block; width:24px; height:24px; }
.tab-item.active { color:#E93323; }
.tab-item:active { opacity:0.7; }
.toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.75); color:#fff; padding:12px 24px; border-radius:8px; font-size:13px; z-index:999; pointer-events:none; opacity:0; transition:opacity .2s; }
