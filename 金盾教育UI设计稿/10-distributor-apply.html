<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推广员申请 - 金盾教育分销小程序</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background:#E8E8ED; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
.phone-frame { width:375px; height:812px; background:#0d0d0d; border-radius:44px; position:relative; box-shadow: 0 0 0 3px #1a1a1a, 0 0 0 6px #0d0d0d, 0 0 0 8px #222, 0 12px 50px rgba(0,0,0,0.35); overflow:hidden; }
.phone-screen { position:absolute; top:0; left:0; right:0; bottom:0; background:#F5F5F5; border-radius:40px; overflow:hidden; display:flex; flex-direction:column; }
.notch { position:absolute; top:0; left:50%; transform:translateX(-50%); width:210px; height:30px; background:#0d0d0d; border-radius:0 0 20px 20px; z-index:100; }
.home-indicator { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; background:rgba(0,0,0,0.15); border-radius:3px; z-index:100; }
.status-bar { height:54px; background:linear-gradient(180deg,#FFFAF8,#FFF); display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px 10px; font-size:12px; font-weight:600; color:#000; flex-shrink:0; }
.status-time { font-weight:600; }
.status-icons { display:flex; align-items:center; gap:6px; }
.nav-bar { background:linear-gradient(180deg,#FFFDFA,#FFF); padding:10px 14px; display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600; border-bottom:1px solid rgba(233,51,35,0.06); flex-shrink:0; }
.nav-back { cursor:pointer; font-size:16px; color:#333; text-decoration:none; }
.nav-back:active { opacity:0.5; }
.nav-title { flex:1; text-align:center; font-size:15px; font-weight:600; color:#000; padding-right:40px; }
.scroll-content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px; }
.scroll-content::-webkit-scrollbar { width:0; }
.banner { position:relative; background:linear-gradient(135deg,#FFF5ED 0%,#FFE8D6 100%); border-radius:12px; padding:20px 16px 16px 16px; margin-top:14px; overflow:hidden; }
.banner-decoration { position:absolute; top:-20px; right:-16px; width:100px; height:100px; border-radius:50%; background:rgba(255,107,53,0.08); pointer-events:none; }
.banner-decoration2 { position:absolute; bottom:-30px; left:-10px; width:70px; height:70px; border-radius:50%; background:rgba(233,51,35,0.06); pointer-events:none; }
.banner-decoration3 { position:absolute; top:40px; right:40px; width:40px; height:40px; border-radius:50%; background:rgba(254,207,106,0.15); pointer-events:none; }
.banner-row { display:flex; align-items:center; gap:14px; position:relative; z-index:1; }
.banner-illust { width:88px; height:88px; flex-shrink:0; border-radius:16px; background:linear-gradient(150deg,#FF6B35 0%,#E93323 100%); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(233,51,35,0.3); }
.banner-text { flex:1; }
.banner-title { font-size:17px; font-weight:700; color:#1F2937; line-height:1.3; }
.banner-title span { color:#E93323; }
.banner-desc { font-size:12px; color:#6B7280; margin-top:4px; line-height:1.4; }
.banner-tags { display:flex; gap:6px; margin-top:14px; position:relative; z-index:1; }
.banner-tag { display:flex; align-items:center; gap:3px; background:rgba(233,51,35,0.08); padding:5px 10px; border-radius:14px; font-size:11px; color:#E93323; font-weight:500; }
.banner-tag svg { width:12px; height:12px; }
.form-card { background:#fff; border-radius:10px; padding:14px; margin-top:12px; }
.form-label { font-size:13px; font-weight:500; color:#333; margin-bottom:6px; }
.form-input { width:100%; background:#F5F5F5; border:0.5px solid #E8E8E8; border-radius:6px; padding:10px 12px; font-size:13px; outline:none; color:#333; transition:border-color .15s; }
.form-input:focus { border-color:#E93323; }
.form-input::placeholder { color:#B0B0B0; }
.form-textarea { width:100%; background:#F5F5F5; border:0.5px solid #E8E8E8; border-radius:6px; padding:10px 12px; font-size:13px; outline:none; color:#333; resize:none; height:80px; font-family:inherit; transition:border-color .15s; }
.form-textarea:focus { border-color:#E93323; }
.form-textarea::placeholder { color:#B0B0B0; }
.form-hint { font-size:10px; color:#B0B0B0; margin-top:4px; }
.submit-btn { width:100%; background:linear-gradient(135deg,#E93323,#FF6B35); color:#fff; text-align:center; padding:13px; border-radius:22px; font-size:14px; font-weight:600; cursor:pointer; margin-top:20px; border:none; }
.submit-btn:active { opacity:0.8; }
/* 审核中状态 */
.review-banner { background:#fff; border-radius:10px; padding:16px; margin-top:14px; display:flex; align-items:center; gap:12px; border:0.5px solid #FED7AA; }
.review-icon { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#FFEDD5,#FED7AA); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.review-info { flex:1; }
.review-title { font-size:14px; font-weight:600; color:#C2410C; }
.review-desc { font-size:11px; color:#9A3412; margin-top:3px; line-height:1.4; }
.review-time { font-size:10px; color:#B0B0B0; margin-top:6px; }
.form-input:disabled, .form-textarea:disabled { background:#F0F0F0; color:#999; -webkit-text-fill-color:#999; opacity:1; border-color:#E8E8E8; }
.toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.75); color:#fff; padding:12px 24px; border-radius:8px; font-size:13px; z-index:999; pointer-events:none; opacity:0; transition:opacity .2s; }
.toast.show { opacity:1; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="notch"></div>
  <div class="phone-screen">
    <div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg width="15" height="11" viewBox="0 0 15 11"><rect x="0" y="7" width="3" height="4" rx="0.5" fill="#000"/><rect x="4" y="5" width="3" height="6" rx="0.5" fill="#000"/><rect x="8" y="3" width="3" height="8" rx="0.5" fill="#000"/><rect x="12" y="0" width="3" height="11" rx="0.5" fill="#000"/></svg><svg width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 2.5C5.2 2.5 3.1 3.3 1.5 4.7L0 3.2C2.1 1.4 4.7 0.5 7.5 0.5S12.9 1.4 15 3.2l-1.5 1.5C11.9 3.3 9.8 2.5 7.5 2.5z" fill="#000"/><path d="M7.5 5.5C6.1 5.5 4.9 6 4 6.8L2.5 5.3C3.9 4.1 5.6 3.5 7.5 3.5s3.6 0.6 5 1.8L11 6.8C10.1 6 8.9 5.5 7.5 5.5z" fill="#000"/><circle cx="7.5" cy="9" r="1.5" fill="#000"/></svg><svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="0" width="21" height="12" rx="2.5" stroke="#000" stroke-width="1" fill="none"/><rect x="2" y="2" width="14" height="8" rx="1" fill="#000"/><rect x="22" y="3.5" width="2" height="5" rx="0.8" fill="#000"/></svg></div></div>
    <div class="nav-bar"><span class="nav-back" onclick="goBack()">←</span><span class="nav-title">推广员申请</span></div>
    <div class="scroll-content">
      <div class="banner">
        <div class="banner-decoration"></div>
        <div class="banner-decoration2"></div>
        <div class="banner-decoration3"></div>
        <div class="banner-row">
          <div class="banner-illust">
            <svg viewBox="0 0 48 48" style="width:48px;height:48px">
              <!-- 分享图标 -->
              <rect x="20" y="4" width="16" height="10" rx="2" fill="#fff" opacity="0.95"/>
              <rect x="22" y="6" width="12" height="2" rx="1" fill="#E93323" opacity="0.3"/>
              <rect x="22" y="9" width="8" height="2" rx="1" fill="#E93323" opacity="0.3"/>
              <!-- 箭头 -->
              <path d="M18 22L34 22" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
              <polygon points="32,18 38,22 32,26" fill="#fff" opacity="0.8"/>
              <!-- 金币 -->
              <circle cx="36" cy="36" r="8" fill="#FECF6A"/>
              <text x="36" y="39" text-anchor="middle" font-size="9" font-weight="700" fill="#E93323">¥</text>
              <!-- 人物剪影 -->
              <circle cx="14" cy="32" r="6" fill="#fff" opacity="0.7"/>
              <path d="M4 48c0-6 4.5-10 10-10s10 4 10 10" fill="#fff" opacity="0.5"/>
              <!-- 手机 -->
              <rect x="24" y="30" width="6" height="10" rx="1" fill="#fff" opacity="0.7"/>
              <rect x="25.5" y="31.5" width="3" height="5" rx="0.5" fill="#E93323" opacity="0.3"/>
            </svg>
          </div>
          <div class="banner-text">
            <div class="banner-title">申请成为<span>推广员</span></div>
            <div class="banner-desc">分享优质课程，好友下单即享佣金奖励，自购更省钱</div>
          </div>
        </div>
        <div class="banner-tags">
          <div class="banner-tag"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#FECF6A"/><text x="8" y="11.5" text-anchor="middle" font-size="8" font-weight="700" fill="#E93323">¥</text></svg>高额佣金</div>
          <div class="banner-tag"><svg viewBox="0 0 16 16"><path d="M3 5l5 5 5-5" stroke="#E93323" stroke-width="2" fill="none" stroke-linecap="round"/></svg>邀请奖励</div>
          <div class="banner-tag"><svg viewBox="0 0 16 16"><circle cx="3" cy="3" r="2" fill="#FECF6A"/><circle cx="13" cy="3" r="2" fill="#FECF6A"/><circle cx="8" cy="13" r="2" fill="#FECF6A"/><line x1="4.5" y1="4.5" x2="7" y2="11.5" stroke="#E93323" stroke-width="1.2"/><line x1="11.5" y1="4.5" x2="9" y2="11.5" stroke="#E93323" stroke-width="1.2"/></svg>裂变推广</div>
        </div>
      </div>
      <div class="form-card">
        <div class="form-label">真实姓名</div>
        <input class="form-input" type="text" placeholder="请输入真实姓名" id="nameInput">
        <div class="form-label" style="margin-top:12px;">手机号码</div>
        <input class="form-input" type="tel" placeholder="请输入手机号码" id="phoneInput">
        <div class="form-label" style="margin-top:12px;">申请备注</div>
        <textarea class="form-textarea" placeholder="请输入申请备注（选填）" id="remarkInput"></textarea>
        <div class="form-hint">填写备注信息有助于更快通过审核</div>
      </div>
      <div class="review-banner" id="reviewBanner" style="display:none;">
        <div class="review-icon"><svg viewBox="0 0 24 24" style="width:22px;height:22px;"><circle cx="12" cy="12" r="10" stroke="#C2410C" stroke-width="2" fill="none"/><path d="M12 6v6M12 16v1" stroke="#C2410C" stroke-width="2.5" stroke-linecap="round"/></svg></div>
        <div class="review-info">
          <div class="review-title">申请审核中</div>
          <div class="review-desc">您的推广员申请已提交，平台正在审核中，请耐心等待</div>
          <div class="review-time" id="reviewTime">提交于 2026-06-26 16:50</div>
        </div>
      </div>
      <button class="submit-btn" id="submitBtn" onclick="doSubmit()">提交申请</button>
      <div style="height:16px;"></div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div>
<div class="toast" id="toast"></div>
<script>
function navigateTo(url){try{var s=JSON.parse(localStorage.getItem("jd_nav")||"[]");var c=location.pathname.split("/").pop()||"index.html";s.push(c);localStorage.setItem("jd_nav",JSON.stringify(s));}catch(e){}location.href=url;}
function goBack(){try{var s=JSON.parse(localStorage.getItem("jd_nav")||"[]");while(s.length){var p=s.pop();if(p!==(location.pathname.split("/").pop()||"")){localStorage.setItem("jd_nav",JSON.stringify(s));location.href=p;return;}}}catch(e){}location.href="index.html";}
function showToast(msg) { var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},1500); }

var nameInput = document.getElementById('nameInput');
var phoneInput = document.getElementById('phoneInput');
var remarkInput = document.getElementById('remarkInput');
var submitBtn = document.getElementById('submitBtn');
var reviewBanner = document.getElementById('reviewBanner');
var reviewTime = document.getElementById('reviewTime');

// 页面初始化：检查审核状态
(function init(){
  var status = localStorage.getItem('jd_distributor_status');
  var dataStr = localStorage.getItem('jd_distributor_data');
  var timeStr = localStorage.getItem('jd_distributor_time');
  if(status === 'reviewing'){
    // 审核中：显示横幅 + 回填数据 + 禁用所有输入 + 隐藏提交按钮
    reviewBanner.style.display = '';
    submitBtn.style.display = 'none';
    if(timeStr){ reviewTime.textContent = timeStr; }
    // 禁用输入
    nameInput.disabled = true; phoneInput.disabled = true; remarkInput.disabled = true;
    // 移除focus样式
    nameInput.style.borderColor = '#E8E8E8'; phoneInput.style.borderColor = '#E8E8E8'; remarkInput.style.borderColor = '#E8E8E8';
    // 回填已有数据
    if(dataStr){
      try{
        var data = JSON.parse(dataStr);
        if(data.name) nameInput.value = data.name;
        if(data.phone) phoneInput.value = data.phone;
        if(data.remark) remarkInput.value = data.remark;
      }catch(e){}
    }
    // 修改描述文案
    document.querySelector('.form-hint').textContent = '审核期间无法修改申请信息';
  }else if(status === 'approved'){
    // 已通过：直接跳到推广员中心
    navigateTo('09-distributor.html');
  }
  // status 为 null：正常申请状态，不做任何处理
})();

function doSubmit() {
  var name = nameInput.value.trim();
  var phone = phoneInput.value.trim();
  var remark = remarkInput.value.trim();
  if(!name) { showToast('请输入真实姓名'); return; }
  if(!phone) { showToast('请输入手机号码'); return; }
  // 保存申请数据
  var now = new Date();
  var timeStr = '提交于 ' + now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  localStorage.setItem('jd_distributor_status', 'reviewing');
  localStorage.setItem('jd_distributor_data', JSON.stringify({name:name, phone:phone, remark:remark}));
  localStorage.setItem('jd_distributor_time', timeStr);
  showToast('申请提交成功，请等待审核');
  // 延迟刷新页面，进入审核中状态
  setTimeout(function(){ location.reload(); }, 1500);
}
</script>
</body>
</html>
